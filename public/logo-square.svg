<!--
  The full-bleed source for the raster icons: iOS rounds apple-touch-icon.png
  itself, and a transparent corner would come back black. Regenerate after an
  edit with `python3 -m cairosvg` (pip install cairosvg):
    public/apple-touch-icon.png  120x120 from this file
    public/favicon-32.png, favicon-16.png, favicon.ico  from public/logo.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="WorkoutsMCP">
  <title>WorkoutsMCP</title>
  <defs>
    <linearGradient id="wm-square" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b8dff"/>
      <stop offset="1" stop-color="#1546b8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#wm-square)"/>
  <g fill="#ffffff">
    <rect x="11" y="35.5" width="6.5" height="13.5" rx="3.25" opacity="0.55"/>
    <rect x="20" y="25" width="6.5" height="24" rx="3.25" opacity="0.8"/>
    <rect x="28.75" y="15.5" width="6.5" height="33.5" rx="3.25" fill="#5fe0a0"/>
    <rect x="37.5" y="25" width="6.5" height="24" rx="3.25" opacity="0.8"/>
    <rect x="46.5" y="35.5" width="6.5" height="13.5" rx="3.25" opacity="0.55"/>
  </g>
  <path d="M12.5 53.5h39" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4" fill="none"/>
</svg>
