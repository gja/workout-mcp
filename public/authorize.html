<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect an app</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main class="narrow">
      <h1>Connect an app</h1>
      <div id="body"></div>
    </main>

    <script type="module">
      import { api, currentUser, el, mountLogin } from '/auth.js';

      const body = document.getElementById('body');
      const params = new URLSearchParams(location.search);

      // The Worker has already checked client_id and redirect_uri before
      // serving this page, so these are safe to act on.
      const request = {
        client_id: params.get('client_id'),
        redirect_uri: params.get('redirect_uri'),
        code_challenge: params.get('code_challenge'),
        state: params.get('state'),
        resource: params.get('resource'),
      };

      const fail = (message) => body.replaceChildren(el('p', { className: 'error', textContent: message }));

      async function consent(user, client) {
        const approve = el('button', { className: 'primary', textContent: 'Allow access' });
        const cancel = el('button', { textContent: 'Cancel' });
        const status = el('p', { className: 'note' });

        approve.onclick = async () => {
          approve.disabled = cancel.disabled = true;
          try {
            const { redirect } = await api('/oauth/authorize', { method: 'POST', body: request });
            location.href = redirect;
          } catch (error) {
            status.className = 'error';
            status.textContent = error.message;
            approve.disabled = cancel.disabled = false;
          }
        };

        // Cancelling is reported to the client, not left hanging.
        cancel.onclick = () => {
          const target = new URL(request.redirect_uri);
          target.searchParams.set('error', 'access_denied');
          if (request.state) target.searchParams.set('state', request.state);
          location.href = target.toString();
        };

        body.replaceChildren(
          el('p', { className: 'sub' }, [
            el('strong', { textContent: client.client_name }),
            ' wants to read and write the workouts for ',
            el('strong', { textContent: user.email }),
            '.',
          ]),
          el('div', { className: 'row' }, [approve, cancel]),
          status,
        );
      }

      async function start() {
        if (!request.client_id || !request.redirect_uri || !request.code_challenge) {
          return fail('This link is missing part of the authorization request. Start again from the app.');
        }

        let client;
        try {
          client = await api(`/oauth/client?client_id=${encodeURIComponent(request.client_id)}`);
        } catch (error) {
          return fail(error.message);
        }

        const user = await currentUser();
        if (user) return consent(user, client);

        mountLogin(body, (signedIn) => consent(signedIn, client), {
          intro: `Sign in to connect ${client.client_name}.`,
        });
      }

      start();
    </script>
  </body>
</html>
