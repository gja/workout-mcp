<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workouts</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main>
      <h1>Workouts</h1>
      <p class="sub">Planned sessions from 7 days back to 14 days ahead. Download any of them as a Garmin FIT file.</p>
      <div id="body"></div>
    </main>

    <script type="module">
      import { api, currentUser, el, mountLogin } from '/auth.js';

      const body = document.getElementById('body');

      // -- Workouts ----------------------------------------------------------

      function formatDate(date) {
        const parsed = new Date(`${date}T00:00:00`);
        const label = parsed.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
        const days = Math.round((parsed - new Date().setHours(0, 0, 0, 0)) / 86400000);
        const relative = days === 0 ? ' · today' : days === 1 ? ' · tomorrow' : days === -1 ? ' · yesterday' : '';
        return label + relative;
      }

      // Fetched with the session cookie, then handed to the browser as a blob,
      // so no credential ever ends up in a URL or a history entry.
      async function downloadFit(workout) {
        const response = await fetch(workout.fit_url);
        if (!response.ok) return alert(`Could not export: ${response.status}`);
        const url = URL.createObjectURL(await response.blob());
        el('a', { href: url, download: `${workout.date}-${workout.id}.fit` }).click();
        URL.revokeObjectURL(url);
      }

      function workoutCard(workout, reload) {
        // The summary comes from the server, so the dashboard and MCP agree.
        const steps = workout.summary.split('\n').slice(1).join('\n');

        const download = el('button', { className: 'link', textContent: 'Download .fit' });
        download.onclick = () => downloadFit(workout);

        const remove = el('button', { className: 'link danger', textContent: 'Delete' });
        remove.onclick = async () => {
          if (!confirm(`Delete "${workout.name}" on ${workout.date}?`)) return;
          await fetch(workout.json_url, { method: 'DELETE' });
          reload();
        };

        return el('article', { className: 'card' }, [
          el('header', {}, [
            el('h3', { textContent: workout.name }),
            el('span', { className: 'id', textContent: workout.id }),
          ]),
          el('pre', { textContent: steps }),
          el('div', { className: 'actions' }, [download, remove]),
        ]);
      }

      function renderWorkouts(workouts, reload) {
        if (workouts.length === 0) {
          return [el('p', { className: 'empty', textContent: 'No workouts planned in this window.' })];
        }
        const sections = [];
        let currentDate = null;
        let day = null;
        for (const workout of workouts) {
          if (workout.date !== currentDate) {
            currentDate = workout.date;
            day = el('section', { className: 'day' }, [el('h2', { textContent: formatDate(workout.date) })]);
            sections.push(day);
          }
          day.append(workoutCard(workout, reload));
        }
        return sections;
      }

      // -- Tokens ------------------------------------------------------------

      function renderConnections(connections, reload) {
        if (connections.length === 0) return [];
        const rows = connections.map((connection) => {
          const revoke = el('button', { className: 'link danger', textContent: 'Disconnect' });
          revoke.onclick = async () => {
            if (!confirm(`Disconnect ${connection.client_name}? It will have to sign in again.`)) return;
            await fetch(`/api/connections/${connection.id}`, { method: 'DELETE' });
            reload();
          };
          return el('article', { className: 'card' }, [
            el('header', {}, [
              el('h3', { textContent: connection.client_name }),
              el('span', { className: 'id', textContent: new Date(connection.created_at).toLocaleDateString() }),
            ]),
            el('div', { className: 'actions' }, [revoke]),
          ]);
        });
        return [
          el('h2', { textContent: 'Connected apps' }),
          el('p', { className: 'note', textContent: 'MCP clients that signed in with OAuth.' }),
          ...rows,
        ];
      }

      function renderTokens(tokens, reload) {
        const rows = tokens.map((token) => {
          const label = token.name ?? 'API token';
          const revoke = el('button', { className: 'link danger', textContent: 'Revoke' });
          revoke.onclick = async () => {
            if (!confirm(`Revoke ${label}? Anything using it stops working.`)) return;
            await fetch(`/api/tokens/${token.prefix}`, { method: 'DELETE' });
            reload();
          };
          return el('article', { className: 'card' }, [
            el('header', {}, [
              el('h3', { textContent: label }),
              el('span', { className: 'id', textContent: `${token.prefix}…` }),
            ]),
            el('div', { className: 'actions' }, [revoke]),
          ]);
        });

        const name = el('input', { placeholder: 'What is it for? e.g. Garmin watch' });
        const create = el('button', { className: 'primary', type: 'submit', textContent: 'New token' });
        const shown = el('div');

        const form = el('form', {}, [name, create]);
        form.onsubmit = async (event) => {
          event.preventDefault();
          create.disabled = true;
          try {
            const issued = await api('/api/tokens', { method: 'POST', body: { name: name.value } });
            // Shown once and never again — only the hash is stored.
            shown.replaceChildren(
              el('div', { className: 'secret', textContent: issued.token }),
              el('p', { className: 'note', textContent: issued.note }),
            );
            name.value = '';
            reload({ keep: shown });
          } catch (error) {
            shown.replaceChildren(el('p', { className: 'error', textContent: error.message }));
          } finally {
            create.disabled = false;
          }
        };

        return [
          el('h2', { textContent: 'Tokens' }),
          el('p', { className: 'note', textContent: 'For a watch app, a script, or an MCP client that wants a static header.' }),
          el('div', { className: 'row' }, [form]),
          shown,
          ...rows,
        ];
      }

      // -- Page --------------------------------------------------------------

      async function showDashboard(user) {
        const reload = async ({ keep } = {}) => {
          const [{ workouts }, { tokens }, { connections }] = await Promise.all([
            api('/api/workouts.json'),
            api('/api/tokens'),
            api('/api/connections'),
          ]);

          const signOut = el('button', { className: 'link', textContent: 'Sign out' });
          signOut.onclick = async () => {
            await fetch('/api/auth/logout', { method: 'POST' });
            start();
          };

          body.replaceChildren(
            el('div', { className: 'row' }, [
              el('span', { className: 'note', textContent: user.email ?? 'Signed in' }),
              signOut,
            ]),
            ...renderWorkouts(workouts, reload),
            ...renderConnections(connections, reload),
            ...renderTokens(tokens, reload),
          );
          // Keep a just-issued token visible across the reload.
          if (keep) body.append(keep);
        };
        await reload();
      }

      async function start() {
        const user = await currentUser();
        if (user) return showDashboard(user);
        mountLogin(body, { intro: 'Sign in to see your planned workouts.' });
      }

      start();
    </script>
  </body>
</html>
